name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # vendor/ is a committed copy from node_modules; catch a mux.js bump
      # (e.g. from Dependabot) that forgot to re-run `npm run vendor`.
      - name: Vendored mux.js matches package-lock
        run: npm run vendor && git diff --exit-code vendor/
      - run: npm run check
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # Unsigned build: loadable via about:debugging for testing a PR.
      - uses: actions/upload-artifact@v7
        with:
          name: video-grabber-unsigned
          path: web-ext-artifacts/*.zip
